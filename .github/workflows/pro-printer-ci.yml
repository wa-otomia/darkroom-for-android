name: Pro printer regression checks

on:
  pull_request:
  push:
    branches: [fix/pro-printer-status-recovery]

permissions:
  contents: read

concurrency:
  group: pro-printer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0"
          log-accepted-android-sdk-licenses: false
      - name: Run JVM tests and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: darkroom-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
