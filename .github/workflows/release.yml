name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@7a445ee88d4e23b52c33b9b52b81b2361c2c7d0b # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

      - uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v4.0.0
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Version from tag
        run: |
          name="${GITHUB_REF_NAME#v}"
          core="${name%%-*}"
          IFS='.' read -r major minor patch _ <<EOF
          $core
          EOF
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}
          major=${major//[^0-9]/}
          minor=${minor//[^0-9]/}
          patch=${patch//[^0-9]/}
          code=$((10#${major:-0} * 10000 + 10#${minor:-0} * 100 + 10#${patch:-0}))
          if [ "$code" -le 0 ]; then code=1; fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Decode keystore
        if: ${{ secrets.SIGNING_STORE_BASE64 != '' }}
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: |
          echo "$SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and assemble
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon
          :app:testDebugUnitTest
          :app:assembleRelease
          -PversionName="${VERSION_NAME}"
          -PversionCode="${VERSION_CODE}"

      - name: Name the APK
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" "darkroom-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk
          path: darkroom-*.apk

  publish:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: darkroom-*.apk
          generate_release_notes: true
